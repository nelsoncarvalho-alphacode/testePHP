version: '3'
services:
  mysql:
    image: mysql:5.7
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: TestPassword
      MYSQL_DATABASE: bdVagas
      MYSQL_USER: lauradamascenno
      MYSQL_PASSWORD: UserTestPassword
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d

  php:
    image: php:7.4-apache
    restart: always
    ports:
      - 8000:80
    volumes:
      - ./php:/var/www/html
    depends_on:
      - mysql
